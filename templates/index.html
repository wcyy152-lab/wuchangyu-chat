<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>武昌鱼 - AI Chat</title>
    <meta name="description" content="和武昌鱼（王辰祎）聊聊天——首师大 INTP 处女座，剧本杀/OW/明日方舟玩家">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐟</text></svg>">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg: #0f0f0f;
            --sidebar-bg: #1a1a1a;
            --chat-bg: #111111;
            --bubble-me: #2b5278;
            --bubble-other: #212121;
            --text: #e0e0e0;
            --text-secondary: #999;
            --accent: #5278a0;
            --border: #2a2a2a;
            --input-bg: #1a1a1a;
            --danger: #c0392b;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            display: flex;
            overflow: hidden;
        }

        /* 侧边栏 - 个人资料 */
        .sidebar {
            width: 320px;
            min-width: 320px;
            background: var(--sidebar-bg);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            padding: 32px 24px;
            gap: 20px;
            overflow-y: auto;
        }
        .sidebar .avatar {
            width: 80px; height: 80px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a6186, #5278a0);
            display: flex; align-items: center; justify-content: center;
            font-size: 36px;
            margin: 0 auto;
        }
        .sidebar h1 { font-size: 24px; font-weight: 700; text-align: center; }
        .sidebar .subtitle { color: var(--text-secondary); text-align: center; font-size: 13px; margin-top: -12px; }
        .sidebar .info-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .sidebar .info-item {
            background: var(--input-bg);
            border-radius: 10px;
            padding: 10px 12px;
            text-align: center;
        }
        .sidebar .info-item .label { font-size: 11px; color: var(--text-secondary); }
        .sidebar .info-item .value { font-size: 14px; font-weight: 600; margin-top: 2px; }
        .sidebar .tags { display: flex; flex-wrap: wrap; gap: 6px; }
        .sidebar .tag {
            background: var(--bubble-other);
            color: var(--text-secondary);
            padding: 4px 10px; border-radius: 12px;
            font-size: 12px;
        }
        .sidebar .bio {
            font-size: 13px; line-height: 1.7; color: var(--text-secondary);
            background: var(--input-bg);
            border-radius: 12px;
            padding: 14px;
        }
        .sidebar .reset-btn {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text-secondary);
            padding: 10px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.2s;
        }
        .sidebar .reset-btn:hover {
            background: var(--danger);
            border-color: var(--danger);
            color: white;
        }

        /* 聊天区 */
        .chat-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--chat-bg);
            min-width: 0;
        }
        .chat-header {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .chat-header .small-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: linear-gradient(135deg, #3a6186, #5278a0);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px;
        }
        .chat-header .header-info .name { font-weight: 600; font-size: 15px; }
        .chat-header .header-info .status { font-size: 12px; color: var(--text-secondary); }

        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .messages::-webkit-scrollbar { width: 4px; }
        .messages::-webkit-scrollbar-track { background: transparent; }
        .messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .message {
            max-width: 75%;
            display: flex;
            flex-direction: column;
            animation: fadeIn 0.3s ease;
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

        .message.user { align-self: flex-end; }
        .message.bot { align-self: flex-start; }

        .message .bubble {
            padding: 10px 14px;
            border-radius: 16px;
            font-size: 14px;
            line-height: 1.5;
            word-break: break-word;
        }
        .message.user .bubble { background: var(--bubble-me); border-bottom-right-radius: 4px; }
        .message.bot .bubble { background: var(--bubble-other); border-bottom-left-radius: 4px; }

        .message .time {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            padding: 0 4px;
        }
        .message.user .time { text-align: right; }

        .typing-indicator {
            align-self: flex-start;
            background: var(--bubble-other);
            padding: 12px 16px;
            border-radius: 16px;
            border-bottom-left-radius: 4px;
            display: none;
        }
        .typing-indicator.active { display: flex; gap: 4px; align-items: center; }
        .typing-indicator span {
            width: 6px; height: 6px;
            background: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes bounce {
            0%, 60%, 100% { transform: translateY(0); }
            30% { transform: translateY(-8px); }
        }

        .input-area {
            padding: 16px 24px;
            border-top: 1px solid var(--border);
            display: flex;
            gap: 12px;
            align-items: flex-end;
        }
        .input-area textarea {
            flex: 1;
            background: var(--input-bg);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 12px 16px;
            color: var(--text);
            font-size: 14px;
            font-family: inherit;
            resize: none;
            min-height: 44px;
            max-height: 120px;
            outline: none;
            transition: border-color 0.2s;
        }
        .input-area textarea:focus { border-color: var(--accent); }
        .input-area button {
            width: 44px; height: 44px;
            border-radius: 50%;
            border: none;
            background: var(--accent);
            color: white;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            flex-shrink: 0;
            display: flex; align-items: center; justify-content: center;
        }
        .input-area button:hover { opacity: 0.85; transform: scale(1.05); }
        .input-area button:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

        .input-hint {
            font-size: 11px;
            color: var(--text-secondary);
            text-align: center;
            padding: 4px 24px 8px;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .sidebar { display: none; }
            .message { max-width: 88%; }
            .messages { padding: 16px; }
            .input-area { padding: 12px 16px; }
        }

        .error-banner {
            background: #3c1a1a;
            color: #e57373;
            padding: 12px 24px;
            font-size: 13px;
            text-align: center;
            border-bottom: 1px solid var(--danger);
        }
    </style>
</head>
<body>

<!-- 侧边栏 -->
<aside class="sidebar">
    <div class="avatar">🐟</div>
    <h1>武昌鱼</h1>

    <div class="info-item" style="margin-top:8px">
        <div class="label">MBTI</div>
        <div class="value">INTP</div>
    </div>

    <p class="bio">
        我是武昌鱼，可以和我聊天就可以
    </p>

    <button class="reset-btn" onclick="resetChat()">重新开始对话</button>
</aside>

<!-- 聊天区 -->
<main class="chat-area">
    <div class="chat-header">
        <div class="small-avatar">🐟</div>
        <div class="header-info">
            <div class="name">武昌鱼</div>
            <div class="status" id="statusText">在线</div>
        </div>
    </div>

    <div id="messages" class="messages">
        <div class="message bot">
            <div class="bubble">我是武昌鱼，可以和我聊天就可以</div>
            <div class="time">现在</div>
        </div>
    </div>

    <div id="typingIndicator" class="typing-indicator">
        <span></span><span></span><span></span>
    </div>

    <p class="input-hint">按 Enter 发送，Shift+Enter 换行</p>
    <div class="input-area">
        <textarea id="userInput" placeholder="发消息..." rows="1"></textarea>
        <button id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</main>

<script>
    const messagesEl = document.getElementById('messages');
    const inputEl = document.getElementById('userInput');
    const sendBtn = document.getElementById('sendBtn');
    const typingEl = document.getElementById('typingIndicator');
    const statusEl = document.getElementById('statusText');

    let isWaiting = false;

    function scrollToBottom() {
        messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    function formatTime() {
        const now = new Date();
        return now.getHours().toString().padStart(2, '0') + ':' +
               now.getMinutes().toString().padStart(2, '0');
    }

    function addMessage(role, text) {
        const div = document.createElement('div');
        div.className = 'message ' + role;
        div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>
                         <div class="time">${formatTime()}</div>`;
        messagesEl.appendChild(div);
        scrollToBottom();
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML.replace(/\n/g, '<br>');
    }

    function showTyping(show) {
        typingEl.classList.toggle('active', show);
        statusEl.textContent = show ? '正在输入...' : '在线';
    }

    async function sendMessage() {
        if (isWaiting) return;
        const text = inputEl.value.trim();
        if (!text) return;

        isWaiting = true;
        inputEl.value = '';
        inputEl.style.height = 'auto';
        sendBtn.disabled = true;

        addMessage('user', text);
        showTyping(true);

        try {
            const resp = await fetch('/api/chat', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ message: text }),
            });
            const data = await resp.json();

            showTyping(false);

            if (data.error) {
                addMessage('bot', '唔，出问题了（' + data.error + '）');
                statusEl.textContent = '出错';
            } else {
                addMessage('bot', data.reply);
                statusEl.textContent = '在线';
            }
        } catch (e) {
            showTyping(false);
            addMessage('bot', '网络好像不太行（' + e.message + '）');
            statusEl.textContent = '连接断开';
        }

        isWaiting = false;
        sendBtn.disabled = false;
        inputEl.focus();
    }

    async function resetChat() {
        if (!confirm('确定要重新开始对话吗？')) return;
        try {
            await fetch('/api/reset', { method: 'POST' });
            messagesEl.innerHTML = '';
            addMessage('bot', '我是武昌鱼，可以和我聊天就可以');
            statusEl.textContent = '在线';
        } catch (e) {
            // ignore
        }
    }

    // 输入框事件
    inputEl.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });

    // 自动调整输入框高度
    inputEl.addEventListener('input', () => {
        inputEl.style.height = 'auto';
        inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
    });

    // 初始聚焦
    inputEl.focus();
    scrollToBottom();
</script>
</body>
</html>
